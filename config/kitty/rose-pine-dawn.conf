inactive_tab_background   #faf4ed
tab_title_template        "{fmt.fg._dfdad9}{fmt.bg._faf4ed}{fmt.fg._575279}{fmt.bg._dfdad9} {title[:12]} {fmt.fg._dfdad9}{fmt.bg._faf4ed}{fmt.bg._faf4ed} "
active_tab_title_template "{fmt.fg._907aa9}{fmt.bg._faf4ed}{fmt.fg._faf4ed}{fmt.bg._907aa9}{fmt.bold} {title[:12]} {fmt.fg._907aa9}{fmt.bg._faf4ed}{fmt.bg._faf4ed} "
