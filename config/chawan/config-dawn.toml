#[start]
#visual-home = "https://www.google.com/"

[buffer]
styling = true
scripting = true
images = true
autofocus = true
cookie = true
user-style = '''
html, body {
    background-color: #faf4ed !important;
    color: #575279 !important;
}
input, textarea, button, select {
    background-color: #f2e9e1 !important;
    color: #575279 !important;
    border: 1px solid #9893a5 !important;
}
p, span, div, td, li {
    color: #575279 !important;
    background-color: transparent !important;
}
table, tr, th, td, td * {
    background-color: #faf4ed !important;
    color: #575279 !important;
    border-color: #9893a5 !important;
}
h1, h2, h3, h4, h5, h6 {
    color: #286983 !important;
}
a {
    color: #907aa9 !important;
}
a:hover {
    color: #b4637a !important;
}
strong, b {
    color: #286983 !important;
}
pre, code, kbd, tt, samp, blockquote {
    text-decoration: none !important;
    background-color: #f2e9e1 !important;
    color: #575279 !important;
    border: 1px solid #9893a5 !important;
    border-radius: 5px !important;
    padding: 10px !important;
}
::selection {
    background-color: #dfdad9 !important;
    color: #575279 !important;
}
'''

[display]
color-mode = "auto"
format-mode = "auto"
#image-mode = "kitty"
default-background-color = "#faf4ed"
default-foreground-color = "#575279"
highlight-color = "#b4637a"  # pink highlight
highlight-marks = true
double-width-ambiguous = false
set-title = true

[page]
# Open current page in rdrview for general text view
'C-k' = '() => pager.load("ddg:")'
'r' = "pager.externFilterSource('rdrview -Hu \"$CHA_URL\"')"

# YouTube: allow scripting
[[siteconf]]
host = "https://www.youtube.com/"
scripting = true
styling = true

# Wikipedia: use vector skin
[[siteconf]]
url = '^https?://[a-z]+\.wikipedia\.org/wiki/'
rewrite-url = 'x => x.searchParams.set("useskin", "vector")'
user-style = '''
html, body {
    background-color: #faf4ed !important;
    color: #575279 !important;
}
input, textarea, button, select {
    background-color: #f2e9e1 !important;
    color: #575279 !important;
    border: 1px solid #9893a5 !important;
}
p, span, div, td, li {
    color: #575279 !important;
    background-color: transparent !important;
}

/* Fix table headers and cells - the main culprit */
table, th, td, tr {
    background-color: #fffaf3 !important;
    color: #575279 !important;
    border-color: #dfdad9 !important;
}
th {
    background-color: #f2e9e1 !important;
    color: #575279 !important;
}
/* Alternating rows */
tr:nth-child(even) td {
    background-color: #f2e9e1 !important;
}
tr:nth-child(odd) td {
    background-color: #fffaf3 !important;
}

/* Wikipedia-specific table classes */
.wikitable, .wikitable > * > tr > th, .wikitable > * > tr > td {
    background-color: #fffaf3 !important;
    color: #575279 !important;
    border-color: #dfdad9 !important;
}
.wikitable > * > tr > th {
    background-color: #f2e9e1 !important;
}

h1, h2, h3, h4, h5, h6 {
    color: #286983 !important;
}
a {
    color: #907aa9 !important;
}
a:hover {
    color: #b4637a !important;
}
strong, b {
    color: #286983 !important;
}
pre, code, blockquote {
    background-color: #f2e9e1 !important;
    color: #575279 !important;
    border: 1px solid #9893a5 !important;
    border-radius: 5px !important;
    padding: 10px !important;
}
::selection {
    background-color: #dfdad9 !important;
    color: #575279 !important;
}
img, video, svg {
    background-color: transparent !important;
}
'''

# Google: optional site-specific config
[[siteconf]]
host = '(www\.)?google\.com'
rewrite-url = '''
(x) => {
    // If a search query or other parameters exist (like the initial redirect)
    if (x.search) {
        x.searchParams.set("gbv", "1");
    }
}
'''
cookie = true
scripting = true
styling = true
user-style = '''
*, *::before, *::after { color: revert !important; background-color: revert !important }
'''
# Uncomment if needed:
# Reddit
# [[siteconf]]
# host = "https://www.reddit.com/"
# scripting = true
# styling = true

# Instagram
# [[siteconf]]
# host = "https://www.instagram.com/"
# scripting = true
# styling = true
